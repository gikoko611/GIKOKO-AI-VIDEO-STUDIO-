name: G.I KO KO Android APK (ARMv7)

on:
  push:
    branches: [main, feature/claude-animation-video-skill]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build ARMv7 debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK and ABI
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | tee apk-contents.txt
          grep -q "assets/skills/GI-KO-KO-ANIMATION-VIDEO-STUDIO.md" apk-contents.txt
          if unzip -l "$APK" | grep -q "lib/arm64-v8a/"; then
            echo "Unexpected ARM64-only native payload detected"
            exit 1
          fi
          sha256sum "$APK"
          ls -lh "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GI-KO-KO-AI-VIDEO-STUDIO-ARMv7-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
