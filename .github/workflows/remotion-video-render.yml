name: THE LAST LIGHT - 5 Minute Myanmar Cinematic Render

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: the-last-light-render
  cancel-in-progress: false

jobs:
  render:
    name: Render 9:16 Full Story (720x1280, 30 FPS, 5 minutes)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: cloud-render

    steps:
      - name: Checkout render branch
        uses: actions/checkout@v4
        with:
          ref: feature/the-last-light-render

      - name: Install system tools and Myanmar fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra
          fc-cache -f

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud-render/package.json

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare Remotion browser
        run: npx remotion browser ensure

      - name: Install free English TTS
        run: python3 -m pip install --user --break-system-packages edge-tts

      - name: Generate timed English narration and mix audio
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python3 scripts/generate_narration.py
          test -s public/narration.mp3
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 public/narration.mp3

      - name: Render 5-minute vertical H.264 MP4
        run: |
          mkdir -p out
          npx remotion render src/index.ts MainVideo out/THE-LAST-LIGHT-GI-KO-KO.mp4 \
            --codec=h264 \
            --crf=20 \
            --audio-bitrate=160k \
            --concurrency=2

      - name: Attach standalone Myanmar subtitles
        run: cp assets/subtitles_my.srt out/THE-LAST-LIGHT-MYANMAR.srt

      - name: Verify final media
        run: |
          test -s out/THE-LAST-LIGHT-GI-KO-KO.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of default=noprint_wrappers=1 out/THE-LAST-LIGHT-GI-KO-KO.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 out/THE-LAST-LIGHT-GI-KO-KO.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 out/THE-LAST-LIGHT-GI-KO-KO.mp4
          ls -lh out/

      - name: Upload finished MP4 and subtitles
        uses: actions/upload-artifact@v4
        with:
          name: THE-LAST-LIGHT-GI-KO-KO-5MIN-720P
          path: |
            cloud-render/out/THE-LAST-LIGHT-GI-KO-KO.mp4
            cloud-render/out/THE-LAST-LIGHT-MYANMAR.srt
          if-no-files-found: error
          retention-days: 7
