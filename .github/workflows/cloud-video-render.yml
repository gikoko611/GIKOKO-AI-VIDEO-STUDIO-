name: Cloud Video Render (CPU)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct downloadable URL for the source MP4"
        required: true
        type: string
      aspect_ratio:
        description: "Output aspect ratio"
        required: true
        type: choice
        options: ["9:16", "16:9", "1:1"]
        default: "9:16"
      watermark:
        description: "Watermark text"
        required: false
        type: string
        default: "Powered by I KO KO"
      voiceover_url:
        description: "Optional direct downloadable MP3/WAV voiceover URL"
        required: false
        type: string
      subtitle_url:
        description: "Optional direct downloadable SRT subtitle URL (burned into video)"
        required: false
        type: string
      trim_start:
        description: "Optional trim start in seconds (e.g. 3.5)"
        required: false
        type: string
        default: "0"
      trim_end:
        description: "Optional absolute trim end in seconds (leave blank for full video)"
        required: false
        type: string
        default: ""
      auto_subtitles:
        description: "Generate timestamped subtitles with Whisper when no SRT URL is supplied"
        required: false
        type: boolean
        default: true
      subtitle_language:
        description: "Whisper language (auto, Burmese, or English)"
        required: false
        type: choice
        options: ["auto", "my", "en"]
        default: "auto"
      timeline_json:
        description: "Timeline clip timing data from the editor"
        required: false
        type: string
        default: "[]"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 2

      - name: Download source media
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          VOICEOVER_URL: ${{ inputs.voiceover_url }}
          SUBTITLE_URL: ${{ inputs.subtitle_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 1800 "$VIDEO_URL" -o input.mp4
          test -s input.mp4
          if [[ -n "$VOICEOVER_URL" ]]; then
            curl --fail --location --retry 3 --max-time 900 "$VOICEOVER_URL" -o voiceover.audio
            test -s voiceover.audio
          fi
          if [[ -n "$SUBTITLE_URL" ]]; then
            curl --fail --location --retry 3 --max-time 900 "$SUBTITLE_URL" -o subtitles.srt
            test -s subtitles.srt
          fi
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 input.mp4

      - name: Generate speech-aligned subtitles with Whisper
        if: ${{ inputs.auto_subtitles == true && inputs.subtitle_url == '' }}
        env:
          SUBTITLE_LANGUAGE: ${{ inputs.subtitle_language }}
        run: |
          set -euo pipefail
          if [[ -s voiceover.audio ]]; then AUDIO_INPUT="voiceover.audio"; else
            ffmpeg -y -i input.mp4 -vn -ac 1 -ar 16000 transcription.wav
            AUDIO_INPUT="transcription.wav"
          fi
          python -m pip install --disable-pip-version-check faster-whisper==1.1.1
          AUDIO_INPUT="$AUDIO_INPUT" python - <<'PY'
          import os
          from faster_whisper import WhisperModel
          language = os.environ.get("SUBTITLE_LANGUAGE", "auto")
          model = WhisperModel("small", device="cpu", compute_type="int8")
          kwargs = {"beam_size": 3, "vad_filter": True}
          if language != "auto": kwargs["language"] = language
          segments, info = model.transcribe(os.environ["AUDIO_INPUT"], **kwargs)
          def stamp(seconds):
              ms = max(0, round(seconds * 1000))
              h, ms = divmod(ms, 3600000); m, ms = divmod(ms, 60000); s, ms = divmod(ms, 1000)
              return f"{h:02}:{m:02}:{s:02},{ms:03}"
          count = 0
          with open("subtitles.srt", "w", encoding="utf-8") as out:
              for seg in segments:
                  text = seg.text.strip()
                  if not text: continue
                  count += 1
                  out.write(f"{count}\n{stamp(seg.start)} --> {stamp(seg.end)}\n{text}\n\n")
          if count == 0: raise SystemExit("Whisper found no speech; no subtitle file was produced.")
          print(f"Detected language: {info.language}; subtitle segments: {count}")
          PY
          test -s subtitles.srt

      - name: Render MP4
        env:
          ASPECT_RATIO: ${{ inputs.aspect_ratio }}
          WATERMARK: ${{ inputs.watermark }}
          TRIM_START: ${{ inputs.trim_start }}
          TRIM_END: ${{ inputs.trim_end }}
          TIMELINE_JSON: ${{ inputs.timeline_json }}
        run: |
          set -euo pipefail
          case "$ASPECT_RATIO" in
            "9:16") SIZE="1080:1920" ;;
            "16:9") SIZE="1920:1080" ;;
            "1:1") SIZE="1080:1080" ;;
            *) echo "Unsupported aspect ratio"; exit 1 ;;
          esac
          [[ "$TRIM_START" =~ ^[0-9]+([.][0-9]+)?$ ]] || { echo "Invalid trim_start"; exit 1; }
          if [[ -n "$TRIM_END" ]]; then
            [[ "$TRIM_END" =~ ^[0-9]+([.][0-9]+)?$ ]] || { echo "Invalid trim_end"; exit 1; }
            awk -v s="$TRIM_START" -v e="$TRIM_END" 'BEGIN { exit !(e > s) }' || { echo "trim_end must be greater than trim_start"; exit 1; }
          fi
          printf '%s' "$WATERMARK" > watermark.txt
          python - <<'PY'
          import json, os
          clips = json.loads(os.environ.get("TIMELINE_JSON", "[]") or "[]")
          if not isinstance(clips, list): raise SystemExit("timeline_json must be a JSON list")
          def first(track):
              return next((c for c in clips if c.get("track") == track), {})
          voice = first("VOICE")
          subtitle = first("SUBTITLE")
          with open("timeline.env", "w") as out:
              out.write("VOICE_START=" + str(max(0, float(voice.get("start", 0) or 0))) + "\n")
              out.write("SUBTITLE_START=" + str(max(0, float(subtitle.get("start", 0) or 0))) + "\n")
          PY
          source timeline.env
          if [[ -s subtitles.srt && "$SUBTITLE_START" != "0.0" ]]; then
            SUBTITLE_OFFSET="$SUBTITLE_START" python - <<'PY'
          import os, re
          offset = float(os.environ["SUBTITLE_OFFSET"])
          def shift(m):
              total = ((int(m.group(1))*3600 + int(m.group(2))*60 + int(m.group(3)))*1000 + int(m.group(4))) + round(offset*1000)
              h, total = divmod(total,3600000); mi,total=divmod(total,60000); sec,total=divmod(total,1000)
              return f"{h:02}:{mi:02}:{sec:02},{total:03}"
          p = "subtitles.srt"
          data = open(p, encoding="utf-8").read()
          data = re.sub(r"(\d{2}):(\d{2}):(\d{2}),(\d{3})", shift, data)
          open(p, "w", encoding="utf-8").write(data)
          PY
          fi
          FILTER="scale=$SIZE:force_original_aspect_ratio=decrease,pad=$SIZE:(ow-iw)/2:(oh-ih)/2"
          if [[ -s subtitles.srt ]]; then
            FILTER="$FILTER,subtitles=subtitles.srt"
          fi
          FILTER="$FILTER,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:textfile=watermark.txt:fontcolor=white:fontsize=32:box=1:boxcolor=black@0.45:boxborderw=12:x=w-tw-30:y=h-th-30"
          FFMPEG_ARGS=(-y)
          if [[ "$TRIM_START" != "0" ]]; then FFMPEG_ARGS+=(-ss "$TRIM_START"); fi
          if [[ -n "$TRIM_END" ]]; then FFMPEG_ARGS+=(-to "$TRIM_END"); fi
          FFMPEG_ARGS+=(-i input.mp4)
          if [[ -s voiceover.audio ]]; then FFMPEG_ARGS+=(-itsoffset "$VOICE_START" -i voiceover.audio); fi
          FFMPEG_ARGS+=(-vf "$FILTER" -map 0:v:0)
          if [[ -s voiceover.audio ]]; then
            FFMPEG_ARGS+=(-map 1:a:0 -shortest)
          else
            FFMPEG_ARGS+=(-map "0:a?")
          fi
          FFMPEG_ARGS+=(-c:v libx264 -preset veryfast -crf 23 -c:a aac -b:a 192k -movflags +faststart output.mp4)
          ffmpeg "${FFMPEG_ARGS[@]}"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output.mp4

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: GIKOKO-GITHUB-RENDER-${{ github.run_number }}
          path: output.mp4
          if-no-files-found: error
          retention-days: 3
