name: Text to Video - Wan 3.0

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Describe the video scene, camera movement, lighting, and sound"
        required: true
        type: string
      resolution:
        description: "Output resolution"
        required: true
        type: choice
        options: ["480p", "720p", "1080p"]
        default: "720p"
      aspect_ratio:
        description: "Video aspect ratio"
        required: true
        type: choice
        options: ["9:16", "16:9", "1:1", "4:3", "3:4"]
        default: "9:16"
      duration:
        description: "Generated clip length in seconds"
        required: true
        type: choice
        options: ["5", "10", "15"]
        default: "5"
      audio:
        description: "Generate synchronized audio"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check API secret
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          if [[ -z "$FAL_KEY" ]]; then
            echo "::error::FAL_KEY repository secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Submit Wan 3.0 text-to-video request and wait
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          PROMPT: ${{ inputs.prompt }}
          RESOLUTION: ${{ inputs.resolution }}
          ASPECT_RATIO: ${{ inputs.aspect_ratio }}
          DURATION: ${{ inputs.duration }}
          AUDIO: ${{ inputs.audio }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, time, urllib.request, urllib.error

          endpoint = "alibaba/wan-3.0/text-to-video"
          api_key = os.environ["FAL_KEY"].strip()
          prompt = os.environ["PROMPT"].strip()
          if not prompt:
              raise SystemExit("Prompt cannot be empty.")
          if len(prompt) > 5000:
              raise SystemExit("Prompt is too long (maximum 5000 characters).")

          def request(url, method="GET", payload=None):
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header("Authorization", "Key " + api_key)
              req.add_header("Content-Type", "application/json")
              req.add_header("Accept", "application/json")
              try:
                  with urllib.request.urlopen(req, timeout=120) as response:
                      raw = response.read()
                      return json.loads(raw.decode("utf-8")) if raw else {}
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", "replace")
                  raise RuntimeError(f"fal.ai HTTP {exc.code}: {detail[:1200]}") from exc

          payload = {
              "prompt": prompt,
              "resolution": os.environ["RESOLUTION"],
              "aspect_ratio": os.environ["ASPECT_RATIO"],
              "duration": int(os.environ["DURATION"]),
              "audio": os.environ["AUDIO"].lower() == "true",
              "enable_prompt_expansion": True,
              "enable_safety_checker": True
          }
          print("Submitting prompt to Wan 3.0 Text-to-Video…")
          submitted = request("https://queue.fal.run/" + endpoint, "POST", payload)
          request_id = submitted.get("request_id")
          if not request_id:
              raise SystemExit("fal.ai did not return a request_id: " + json.dumps(submitted)[:1200])
          print("Generation request ID:", request_id)
          status_url = "https://queue.fal.run/" + endpoint + "/requests/" + request_id + "/status"
          result_url = "https://queue.fal.run/" + endpoint + "/requests/" + request_id
          deadline = time.time() + 45 * 60
          while time.time() < deadline:
              state = request(status_url)
              status = state.get("status", "UNKNOWN")
              print("Generation status:", status)
              for log in state.get("logs", []) or []:
                  message = log.get("message")
                  if message:
                      print(message[:500])
              if status == "COMPLETED":
                  break
              if status in ("FAILED", "CANCELLED"):
                  raise SystemExit("fal.ai generation " + status + ": " + json.dumps(state)[:1500])
              time.sleep(10)
          else:
              raise SystemExit("Generation timed out after 45 minutes. Check the fal.ai request dashboard.")

          result = request(result_url)
          video = result.get("video") or {}
          video_url = video.get("url")
          if not video_url or not video_url.startswith("https://"):
              raise SystemExit("fal.ai completed without a valid HTTPS video URL: " + json.dumps(result)[:1500])
          print("Downloading generated MP4…")
          req = urllib.request.Request(video_url, headers={"User-Agent": "GIKOKO-AI-VIDEO-STUDIO"})
          with urllib.request.urlopen(req, timeout=300) as response, open("AI_GENERATED_VIDEO.mp4", "wb") as output:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  output.write(chunk)
          if os.path.getsize("AI_GENERATED_VIDEO.mp4") < 1024:
              raise SystemExit("Downloaded video is empty or too small.")
          print("Generated MP4 size:", os.path.getsize("AI_GENERATED_VIDEO.mp4"), "bytes")
          print("fal.ai result metadata:", json.dumps({k:v for k,v in result.items() if k != "video"})[:1000])
          PY

      - name: Validate generated MP4
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 AI_GENERATED_VIDEO.mp4
          ffmpeg -v error -i AI_GENERATED_VIDEO.mp4 -f null -

      - name: Upload generated video
        uses: actions/upload-artifact@v4
        with:
          name: GIKOKO-AI-TEXT-TO-VIDEO-${{ github.run_number }}
          path: AI_GENERATED_VIDEO.mp4
          if-no-files-found: error
          retention-days: 3
