name: G.I KO KO LTX-2.5 Free ZeroGPU Render

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Motion prompt (English usually gives the most reliable results)
        required: true
        type: string
      image_url:
        description: Optional public JPG/PNG URL for Image-to-Video
        required: false
        type: string
      orientation:
        description: Video orientation
        required: true
        default: portrait
        type: choice
        options:
          - portrait
          - landscape
      duration:
        description: Clip duration (seconds)
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
      seed:
        description: Seed number
        required: true
        default: "42"
        type: string

permissions:
  contents: read

concurrency:
  group: ltx25-zerogpu-${{ github.actor }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cloud-render
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Gradio client
        run: npm install --no-save --no-audit --no-fund @gradio/client

      - name: Generate with LTX-2.5 on Hugging Face ZeroGPU
        env:
          LTX_PROMPT: ${{ inputs.prompt }}
          LTX_IMAGE_URL: ${{ inputs.image_url }}
          LTX_ORIENTATION: ${{ inputs.orientation }}
          LTX_DURATION: ${{ inputs.duration }}
          LTX_SEED: ${{ inputs.seed }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node ltx25-generate.mjs

      - name: Upload MP4 result
        uses: actions/upload-artifact@v4
        with:
          name: GI-KO-KO-LTX-2.5-${{ inputs.orientation }}
          path: |
            cloud-render/out/GI-KO-KO-LTX-2.5.mp4
            cloud-render/out/generation-info.json
          if-no-files-found: error
          retention-days: 3
